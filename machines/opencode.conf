# Machine profile: opencode (T-OPENCODE-03). Sourced by scripts/machine-switch.sh.
# KEY=value only. Host paths come from machines/local.env by variable name;
# PODMANAGER_ROOT (the repo root) is set by the script.

MACHINE_NAME=opencode
CPUS=2
MEMORY_MIB=2048
DISK_GIB=100
ROOTFUL=false

# Volumes, one per line: host:vm[:ro]. Fixed at machine creation; changing
# them means recreating the machine.
#   /workspace  per-project workspace, writable
#   /config     run-time config overrides from the repo, read-only
VOLUMES="
${OPENCODE_WORKSPACE}:/workspace
${PODMANAGER_ROOT}/images/opencode/overrides:/config:ro
"

# Fixed shared volume (PODMANAGER_SHARED -> /shared, writable). Not for this
# machine: keeps the agent away from material staged for other machines.
SHARED=false
