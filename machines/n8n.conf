# Machine profile: n8n (T-PROJ-07). Sourced by scripts/machine-switch.sh.
# KEY=value only. Host paths come from machines/local.env by variable name;
# PODMANAGER_ROOT (the repo root) is set by the script.

MACHINE_NAME=n8n
CPUS=2
MEMORY_MIB=4096
DISK_GIB=50
ROOTFUL=false

# No host volumes: n8n keeps its data in the podman volume n8n_data inside the
# VM (SQLite over virtiofs is risky). Back it up with the recipe in
# images/n8n/run.md before any `podman machine rm n8n`.
VOLUMES=""

SHARED=false
