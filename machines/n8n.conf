# Machine profile: n8n (T-PROJ-07). Sourced by scripts/machine-switch.sh.
# KEY=value only. Host paths come from machines/local.env by variable name;
# PODMANAGER_ROOT (the repo root) is set by the script.

MACHINE_NAME=n8n
CPUS=2
MEMORY_MIB=4096
DISK_GIB=50
ROOTFUL=false

# Volumes, one per line: host:vm[:ro]. Fixed at machine creation. Keep the list
# non-empty: with no --volume, podman machine init shares its defaults (/Users,
# /private, /var/folders, read-write) with the VM. machine-switch.sh refuses an
# empty list and checks the machine's mounts against this list before starting.
#   /n8n/inbox   files for n8n to read, read-only
#   /n8n/outbox  files n8n writes
# n8n's data stays in the podman volume n8n_data inside the VM (SQLite over
# virtiofs is risky). Back it up with the recipe in images/n8n/run.md before
# any `podman machine rm n8n`.
VOLUMES="
${N8N_INBOX}:/n8n/inbox:ro
${N8N_OUTBOX}:/n8n/outbox
"

SHARED=false
